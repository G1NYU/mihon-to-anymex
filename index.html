  body {
    font-family: var(--font-body);

  .container { width: 100%; max-width: 860px; }

  .guide-subtitle { font-size: 0.75rem; color: var(--color-text-muted); margin-left: 0.25rem; }
  .guide-chevron { color: var(--color-text-muted); font-size: 0.8rem; transition: transform 0.25s ease; flex-shrink: 0; }
  .guide-wrap.open .guide-chevron { transform: rotate(180deg); }
  .guide-body { display: none; padding: 0 1.25rem 1.25rem; }
  .guide-wrap.open .guide-body { display: block; }

  .guide-tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .guide-tab { padding: 0.35rem 0.9rem; border-radius: var(--radius-full); font-size: 0.8rem; font-weight: 600; cursor: pointer; border: 1px solid var(--color-border); background: var(--color-surface-2); color: var(--color-text-muted); transition: all 0.18s; }

  .guide-panel { display: none; }
  .guide-panel.active { display: block; }

  .guide-step h4 { font-size: 0.82rem; font-weight: 600; color: var(--color-text); margin-bottom: 0.3rem; }
  .guide-step p { font-size: 0.76rem; color: var(--color-text-muted); line-height: 1.45; }
  .guide-step p a { color: var(--color-primary); text-decoration: none; font-weight: 600; }
  .guide-step p a:hover { text-decoration: underline; }
