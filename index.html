<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#080808;--surface:#111111;--surface-2:#181818;--border:#222222;--border-hi:#333333;
  --text:#f0f0f0;--muted:#666666;--muted-hi:#999999;--lime:#c8f53a;
  --lime-dim:rgba(200,245,58,0.12);--lime-glow:rgba(200,245,58,0.25);
  --error:#ff4f6a;--warn:#f5a623;--success:#3af5a0;--mangayomi:#f07040;
  --reverse:#a78bfa;--reverse-dim:rgba(167,139,250,0.12);--reverse-glow:rgba(167,139,250,0.25);
  --radius:4px;--font-head:'Syne',sans-serif;--font-mono:'Space Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
#bg-wallpaper{
  position:fixed;inset:0;z-index:0;
  background-image:url('https://wallpapercave.com/wp/wp6597690.jpg');
  background-size:cover;background-position:center top;background-repeat:no-repeat;
  filter:brightness(0.18) saturate(0.6);opacity:0.55;pointer-events:none;
}
#bg-wallpaper::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 30%,rgba(8,8,8,0.85) 100%);}
body{
  font-family:var(--font-mono);background:var(--bg);color:var(--text);
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  padding:0 0 6rem;position:relative;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
  opacity:0.035;pointer-events:none;z-index:9999;
}
body::after{content:'';position:fixed;top:0;left:0;right:0;height:2px;background:var(--lime);z-index:100;}
.site-header,.container,.site-footer{position:relative;z-index:1;}
.container{width:100%;max-width:900px;padding:0 2rem;}
.site-header{
  width:100%;max-width:900px;padding:4rem 2rem 2rem;
  border-bottom:1px solid var(--border);margin-bottom:3rem;
  animation:fadeUp 0.6s ease both;
}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem;}
.header-eyebrow{
  font-family:var(--font-mono);font-size:0.7rem;letter-spacing:0.25em;
  text-transform:uppercase;color:var(--lime);
  display:flex;align-items:center;gap:0.75rem;
}
.header-eyebrow::after{content:'';flex:1;height:1px;background:var(--border);max-width:80px;}
.lang-toggle{
  display:inline-flex;align-items:center;
  border:1px solid rgba(200,245,58,0.3);border-radius:4px;overflow:hidden;flex-shrink:0;
}
.lang-btn{
  padding:0.3rem 0.7rem;font-size:0.65rem;font-family:var(--font-mono);
  font-weight:700;letter-spacing:0.1em;cursor:pointer;
  border:none;background:transparent;color:#555;transition:all 0.15s;
}
.lang-btn.active{background:var(--lime);color:#000;}
.site-title{
  font-family:var(--font-head);font-size:clamp(2.5rem,6vw,4.5rem);font-weight:800;
  line-height:0.95;letter-spacing:-0.02em;text-transform:uppercase;
  color:var(--text);margin-bottom:1.25rem;
}
.site-title em{font-style:normal;color:var(--lime);}
.site-desc{
  font-family:var(--font-mono);font-size:0.78rem;line-height:1.8;
  color:var(--muted-hi);max-width:520px;
}
.site-desc code{color:var(--lime);background:var(--lime-dim);padding:0.1em 0.4em;border-radius:2px;font-size:0.76rem;}
.card{
  background:rgba(17,17,17,0.88);backdrop-filter:blur(6px);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:2rem;margin-bottom:1px;position:relative;
  transition:border-color 0.2s;animation:fadeUp 0.5s ease both;
}
.card:hover{border-color:var(--border-hi);}
.card+.card{margin-top:1px;}
.card-head{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:1rem;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:1px solid var(--border);
}
.card-title{font-family:var(--font-head);font-size:1.1rem;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--text);}
.card-num{font-family:var(--font-mono);font-size:0.65rem;color:var(--muted);letter-spacing:0.15em;}
.accordion{
  border:1px solid var(--border);border-radius:var(--radius);margin-bottom:1px;
  overflow:hidden;transition:border-color 0.2s;animation:fadeUp 0.5s ease 0.1s both;
}
.accordion:hover{border-color:var(--border-hi);}
.accordion-trigger{
  display:flex;align-items:center;justify-content:space-between;
  padding:1.25rem 2rem;cursor:pointer;user-select:none;
  background:rgba(17,17,17,0.88);backdrop-filter:blur(6px);gap:1rem;
}
.accordion-trigger-left{display:flex;align-items:center;gap:0.75rem;}
.accordion-label{font-family:var(--font-head);font-size:0.9rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;}
.accordion-sub{font-family:var(--font-mono);font-size:0.65rem;color:var(--muted);letter-spacing:0.1em;}
.accordion-icon{font-size:0.75rem;color:var(--muted);transition:transform 0.3s cubic-bezier(0.4,0,0.2,1);flex-shrink:0;}
.accordion.open .accordion-icon{transform:rotate(180deg);}
.accordion-body{
  max-height:0;overflow:hidden;
  transition:max-height 0.35s cubic-bezier(0.4,0,0.2,1),padding 0.25s ease;
  padding:0 2rem;background:rgba(17,17,17,0.88);backdrop-filter:blur(6px);
  border-top:0px solid var(--border);
}
.accordion.open .accordion-body{max-height:800px;padding:0 2rem 2rem;border-top-width:1px;}
.guide-tabs{display:flex;gap:0;margin:1.25rem 0;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;width:fit-content;}
.guide-tab{padding:0.4rem 1rem;font-family:var(--font-mono);font-size:0.7rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;background:transparent;color:var(--muted);border:none;border-right:1px solid var(--border);transition:all 0.15s;}
.guide-tab:last-child{border-right:none;}
.guide-tab:hover{color:var(--text);background:var(--surface-2);}
.guide-tab.active{background:var(--lime);color:#000;font-weight:700;}
.guide-tab.tab-manga.active{background:var(--mangayomi);color:#000;}
.guide-panel{display:none;}
.guide-panel.active{display:block;}
.guide-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:1rem;}
.guide-step{background:var(--surface-2);padding:1rem 1.25rem;}
.guide-step-num{font-family:var(--font-mono);font-size:0.6rem;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:var(--lime);margin-bottom:0.5rem;}
.guide-step p{font-family:var(--font-mono);font-size:0.75rem;line-height:1.6;color:var(--muted-hi);}
.guide-step a{color:var(--lime);text-decoration:none;}
.guide-step a:hover{text-decoration:underline;}
.guide-step code{background:rgba(200,245,58,0.1);color:var(--lime);padding:0.1em 0.35em;border-radius:2px;font-size:0.72rem;}
.guide-note{font-family:var(--font-mono);font-size:0.72rem;line-height:1.6;color:var(--muted-hi);padding:0.75rem 1rem;border-left:2px solid var(--lime);background:var(--lime-dim);border-radius:0 var(--radius) var(--radius) 0;}
.guide-note code{color:var(--lime);background:none;font-size:0.72rem;}
.batch-card{
  border:1px solid rgba(200,245,58,0.3);
  background:linear-gradient(135deg,rgba(200,245,58,0.04) 0%,rgba(17,17,17,0.88) 60%);
  backdrop-filter:blur(6px);border-radius:var(--radius);margin-bottom:1px;overflow:hidden;
  transition:border-color 0.2s;animation:fadeUp 0.5s ease 0.15s both;
}
.batch-card:hover{border-color:rgba(200,245,58,0.5);}
.batch-trigger{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 2rem;cursor:pointer;user-select:none;gap:1rem;}
.batch-trigger-left{display:flex;align-items:center;gap:0.75rem;}
.batch-icon{font-size:1.1rem;}
.batch-label{font-family:var(--font-head);font-size:0.9rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--lime);}
.batch-sub{font-family:var(--font-mono);font-size:0.65rem;color:var(--muted);letter-spacing:0.08em;}
.batch-chevron{font-size:0.75rem;color:var(--muted);transition:transform 0.3s cubic-bezier(0.4,0,0.2,1);flex-shrink:0;}
.batch-card.open .batch-chevron{transform:rotate(180deg);}
.batch-body{max-height:0;overflow:hidden;transition:max-height 0.35s cubic-bezier(0.4,0,0.2,1),padding 0.25s ease;padding:0 2rem;border-top:0px solid rgba(200,245,58,0.15);}
.batch-card.open .batch-body{max-height:2000px;padding:0 2rem 2rem;border-top-width:1px;}
.batch-result-row{display:flex;align-items:center;gap:0.6rem;padding:0.5rem 0;border-bottom:1px solid var(--border);font-family:var(--font-mono);font-size:0.75rem;}
.batch-result-row:last-child{border-bottom:none;}
.batch-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.batch-dot.ok{background:var(--success);box-shadow:0 0 6px var(--success);}
.batch-dot.skip{background:var(--error);}
.batch-dot.wait{background:var(--warn);}
.batch-result-title{flex:1;color:var(--text);}
.batch-result-match{color:var(--muted);font-size:0.7rem;}
.batch-results-box{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:0.75rem 1rem;max-height:240px;overflow-y:auto;margin-top:1.25rem;display:none;}
.batch-results-box.show{display:block;}
.batch-status{margin-top:0.75rem;font-family:var(--font-mono);font-size:0.72rem;color:var(--muted-hi);min-height:1.2em;}
.share-block{display:none;margin-top:1.5rem;padding:1.25rem;background:rgba(200,245,58,0.04);border:1px solid rgba(200,245,58,0.2);border-radius:var(--radius);animation:fadeUp 0.3s ease both;}
.share-block.show{display:block;}
.share-block-title{font-family:var(--font-head);font-size:0.8rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--lime);margin-bottom:0.75rem;}
.share-url-wrap{display:flex;gap:0.5rem;align-items:stretch;}
.share-url-input{flex:1;font-family:var(--font-mono);font-size:0.7rem;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);color:var(--muted-hi);padding:0.55rem 0.75rem;outline:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text;}
.share-hint{margin-top:0.6rem;font-family:var(--font-mono);font-size:0.65rem;color:var(--muted);line-height:1.5;}
.reverse-card{
  border:1px solid rgba(167,139,250,0.3);
  background:linear-gradient(135deg,rgba(167,139,250,0.04) 0%,rgba(17,17,17,0.88) 60%);
  backdrop-filter:blur(6px);border-radius:var(--radius);margin-bottom:1px;overflow:hidden;
  transition:border-color 0.2s;animation:fadeUp 0.5s ease 0.2s both;
  margin-top:3rem;
}
.reverse-card:hover{border-color:rgba(167,139,250,0.55);}
.reverse-trigger{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 2rem;cursor:pointer;user-select:none;gap:1rem;}
.reverse-trigger-left{display:flex;align-items:center;gap:0.75rem;}
.reverse-icon{font-size:1.1rem;}
.reverse-label{font-family:var(--font-head);font-size:0.9rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--reverse);}
.reverse-sub{font-family:var(--font-mono);font-size:0.65rem;color:var(--muted);letter-spacing:0.08em;}
.reverse-chevron{font-size:0.75rem;color:var(--muted);transition:transform 0.3s cubic-bezier(0.4,0,0.2,1);flex-shrink:0;}
.reverse-card.open .reverse-chevron{transform:rotate(180deg);}
.reverse-body{max-height:0;overflow:hidden;transition:max-height 0.4s cubic-bezier(0.4,0,0.2,1),padding 0.25s ease;padding:0 2rem;border-top:0px solid rgba(167,139,250,0.15);}
.reverse-card.open .reverse-body{max-height:1600px;padding:0 2rem 2rem;border-top-width:1px;}
.reverse-note{font-family:var(--font-mono);font-size:0.72rem;line-height:1.6;color:var(--muted-hi);padding:0.75rem 1rem;border-left:2px solid var(--reverse);background:var(--reverse-dim);border-radius:0 var(--radius) var(--radius) 0;margin-bottom:1.25rem;}
.reverse-note code{color:var(--reverse);background:none;font-size:0.72rem;}
.reverse-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin:1.25rem 0;}
.reverse-step{background:var(--surface-2);padding:1rem 1.25rem;}
.reverse-step-num{font-family:var(--font-mono);font-size:0.6rem;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:var(--reverse);margin-bottom:0.5rem;}
.reverse-step p{font-family:var(--font-mono);font-size:0.75rem;line-height:1.6;color:var(--muted-hi);}
.reverse-step code{background:rgba(167,139,250,0.1);color:var(--reverse);padding:0.1em 0.35em;border-radius:2px;font-size:0.72rem;}
.reverse-result-table{overflow-x:auto;margin-top:1.25rem;}
#toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(2rem);background:rgba(17,17,17,0.95);border:1px solid var(--lime);color:var(--lime);font-family:var(--font-mono);font-size:0.72rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:0.6rem 1.5rem;border-radius:var(--radius);box-shadow:0 4px 24px rgba(0,0,0,0.6),0 0 16px var(--lime-glow);opacity:0;pointer-events:none;z-index:10000;transition:opacity 0.2s ease,transform 0.25s cubic-bezier(0.34,1.56,0.64,1);white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
label{display:block;font-family:var(--font-mono);font-size:0.65rem;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);margin-bottom:0.5rem;}
label span{text-transform:none;letter-spacing:0;font-weight:400;}
input[type=file],input[type=number],input[type=text],select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:var(--font-mono);font-size:0.78rem;padding:0.65rem 0.9rem;outline:none;transition:border-color 0.15s,box-shadow 0.15s;-moz-appearance:textfield;}
input[type=file]:focus,input[type=number]:focus,input[type=text]:focus,select:focus,textarea:focus{border-color:var(--lime);box-shadow:0 0 0 2px var(--lime-dim);}
select{cursor:pointer;}
textarea.batch-input{min-height:120px;resize:vertical;line-height:1.7;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;}
@media(max-width:640px){.row2,.row3{grid-template-columns:1fr;}}
.field{margin-bottom:1.25rem;}
.btn-row{display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:1.5rem;}
button{font-family:var(--font-mono);font-size:0.72rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:0.65rem 1.5rem;border-radius:var(--radius);border:1px solid transparent;cursor:pointer;transition:all 0.15s;position:relative;overflow:hidden;}
button::after{content:'';position:absolute;inset:0;background:#fff;opacity:0;transition:opacity 0.1s;}
button:active::after{opacity:0.08;}
button:disabled{opacity:0.3;cursor:not-allowed;}
button.btn-primary{background:var(--lime);color:#000;border-color:var(--lime);}
button.btn-primary:hover:not(:disabled){background:#d9ff4a;box-shadow:0 0 20px var(--lime-glow);}
button.btn-secondary{background:transparent;color:var(--muted-hi);border-color:var(--border-hi);}
button.btn-secondary:hover:not(:disabled){border-color:var(--muted);color:var(--text);}
button.btn-warn{background:transparent;color:var(--warn);border-color:var(--warn);}
button.btn-warn:hover:not(:disabled){background:rgba(245,166,35,0.1);}
button.btn-success{background:var(--lime);color:#000;border-color:var(--lime);}
button.btn-success:hover:not(:disabled){background:#d9ff4a;box-shadow:0 0 20px var(--lime-glow);}
button.btn-share{background:transparent;color:var(--lime);border-color:rgba(200,245,58,0.4);font-size:0.68rem;padding:0.55rem 1rem;}
button.btn-share:hover:not(:disabled){background:var(--lime-dim);border-color:var(--lime);}
button.btn-reverse{background:var(--reverse);color:#000;border-color:var(--reverse);}
button.btn-reverse:hover:not(:disabled){background:#c4b5fd;box-shadow:0 0 20px var(--reverse-glow);}
.progress-wrap{margin-top:1.5rem;display:none;}
.progress-label{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:0.5rem;}
.progress-title{font-family:var(--font-mono);font-size:0.7rem;color:var(--muted-hi);letter-spacing:0.05em;}
.progress-pct{font-family:var(--font-mono);font-size:0.65rem;color:var(--muted);}
.progress-track{background:var(--surface-2);border:1px solid var(--border);border-radius:2px;height:4px;overflow:hidden;}
.progress-bar{height:100%;border-radius:2px;background:var(--lime);width:0%;transition:width 0.25s ease;box-shadow:0 0 8px var(--lime-glow);}
.progress-bar.ratelimit{background:var(--warn);box-shadow:0 0 8px rgba(245,166,35,0.4);animation:pulse 1s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.5;}}
.pills{display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:1rem;}
.pill{font-family:var(--font-mono);font-size:0.62rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:0.25rem 0.75rem;border-radius:2px;border:1px solid var(--border);color:var(--muted);background:var(--surface-2);}
.pill.ok{border-color:rgba(58,245,160,0.4);color:var(--success);background:rgba(58,245,160,0.06);}
.pill.skip{border-color:rgba(255,79,106,0.4);color:var(--error);background:rgba(255,79,106,0.06);}
.status-box{margin-top:1rem;padding:0.9rem 1rem;border-radius:var(--radius);font-family:var(--font-mono);font-size:0.75rem;line-height:1.6;display:none;border:1px solid var(--border);background:var(--surface-2);white-space:pre-wrap;}
.status-box.show{display:block;}
.status-box.success{border-color:rgba(58,245,160,0.35);background:rgba(58,245,160,0.06);color:var(--success);}
.status-box.error{border-color:rgba(255,79,106,0.35);background:rgba(255,79,106,0.06);color:var(--error);}
.status-box.warn{border-color:rgba(245,166,35,0.35);background:rgba(245,166,35,0.06);color:var(--warn);}
.result-table-wrap{overflow-x:auto;margin-top:1.25rem;}
table{width:100%;border-collapse:collapse;font-size:0.73rem;font-family:var(--font-mono);}
th{text-align:left;padding:0.5rem 0.75rem;color:var(--muted);font-size:0.6rem;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;border-bottom:1px solid var(--border);}
td{padding:0.5rem 0.75rem;border-bottom:1px solid rgba(255,255,255,0.03);color:var(--muted-hi);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,0.015);}
.badge{display:inline-block;padding:0.15rem 0.6rem;border-radius:2px;font-size:0.6rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;}
.badge.ok{background:rgba(58,245,160,0.12);color:var(--success);}
.badge.skip{background:rgba(255,79,106,0.12);color:var(--error);}
.resume-banner{display:none;align-items:center;justify-content:space-between;gap:1rem;background:rgba(245,166,35,0.06);border:1px solid rgba(245,166,35,0.3);border-radius:var(--radius);padding:1rem 1.5rem;margin-bottom:1px;flex-wrap:wrap;animation:fadeUp 0.4s ease both;}
.resume-banner.show{display:flex;}
.resume-banner p{font-family:var(--font-mono);font-size:0.75rem;color:var(--warn);line-height:1.5;}
.resume-banner strong{color:#ffd080;}
.site-footer{margin-top:4rem;width:100%;max-width:900px;padding:2rem 2rem 1.5rem;border-top:1px solid var(--border);}
.footer-top{display:flex;justify-content:space-between;align-items:flex-start;gap:1.5rem;flex-wrap:wrap;margin-bottom:1.5rem;}
.footer-author{display:flex;flex-direction:column;gap:0.6rem;}
.footer-avatar{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);object-fit:cover;transition:border-color 0.2s;}
.footer-avatar:hover{border-color:var(--lime);}
.footer-handle{font-family:var(--font-head);font-size:0.9rem;font-weight:700;letter-spacing:0.04em;color:var(--text);}
.footer-links{display:flex;gap:0.75rem;flex-wrap:wrap;align-items:center;margin-top:0.25rem;}
.footer-link{font-family:var(--font-mono);font-size:0.62rem;color:var(--muted-hi);text-decoration:none;letter-spacing:0.08em;display:inline-flex;align-items:center;gap:0.35rem;padding:0.3rem 0.65rem;border:1px solid var(--border);border-radius:2px;transition:all 0.15s;}
.footer-link:hover{border-color:var(--lime);color:var(--lime);}
.footer-link.paypal:hover{border-color:#009cde;color:#009cde;}
.footer-link.anilist:hover{border-color:#02a9ff;color:#02a9ff;}
.footer-note{font-family:var(--font-mono);font-size:0.6rem;color:var(--muted);line-height:1.7;max-width:340px;}
.footer-stats{display:flex;flex-direction:column;align-items:flex-end;gap:0.5rem;}
.visit-counter{display:flex;align-items:center;gap:0.75rem;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:0.5rem 0.9rem;}
.visit-label{font-family:var(--font-mono);font-size:0.58rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);}
.visit-count{font-family:var(--font-head);font-size:1.1rem;font-weight:800;color:var(--lime);letter-spacing:-0.01em;line-height:1;}
.visit-divider{width:1px;height:28px;background:var(--border);}
.sparkline-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:0.2rem;}
